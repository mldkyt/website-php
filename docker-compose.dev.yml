
services:
  php:
    # image: trafex/php-nginx:latest
    build: .
    ports:
      - "8001:8080"
    volumes:
      - ./src:/var/www/html:z
      - ./components:/var/www/components:z
      - ./02_pgsql.ini:/etc/php85/conf.d/02_pgsql.ini:ro
      - ./default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: always
    pull_policy: always
    env_file: .env
    depends_on:
      migrations:
        condition: service_completed_successfully

  migrations:
    build: webmigrator/.
    env_file: .env
    network_mode: host

  postgres:
    pull_policy: always
    restart: always
    image: postgres:17-alpine
    ports:
     - "5432:5432"
    volumes:
      - ./db:/var/lib/postgresql/data:z
    environment:
      - POSTGRES_USER=luna
      - POSTGRES_PASSWORD=luna
      - POSTGRES_DB=luna

