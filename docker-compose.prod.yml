services:
  php:
    # image: trafex/php-nginx:latest
    build: .
    volumes:
      - ./src:/var/www/html:z
      - ./components:/var/www/components:z
      - ./02_pgsql.ini:/etc/php85/conf.d/02_pgsql.ini:ro
      - ./default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: always
    pull_policy: always
    env_file: .env
    depends_on:
      migrations:
        condition: service_completed_successfully
    extra_hosts:
      - "host.docker.internal:host-gateway"
  anubis:
    image: ghcr.io/techarohq/anubis:latest
    environment:
      BIND: ":8080"
      DIFFICULTY: "5"
      # SERVE_ROBOTS_TXT: "true"
      TARGET: "http://php:8080"
      OG_PASSTHROUGH: "true"
      OG_EXPIRY_TIME: "24h"
    healthcheck:
      test: ["CMD", "anubis", "--healthcheck"]
      interval: 5s
      timeout: 30s
      retries: 5
      start_period: 500ms
    ports:
      - 8001:8080
    restart: always
    pull_policy: always
  migrations:
    build: webmigrator/.
    env_file: .env
    network_mode: host
