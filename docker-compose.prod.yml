services:
  php:
    # image: trafex/php-nginx:latest
    build: .
    ports:
      - "8001:8080"
    volumes:
      - ./src:/var/www/html:z
      - ./components:/var/www/components:z
      - ./02_pgsql.ini:/etc/php85/conf.d/02_pgsql.ini:ro
      - ./03_imports.ini:/etc/php85/conf.d/03_imports.ini:ro
      - ./default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: always
    pull_policy: always
    env_file: .env
    depends_on:
      migrations:
        condition: service_completed_successfully
    extra_hosts:
      - "host.docker.internal:host-gateway"

  migrations:
    build: webmigrator/.
    env_file: .env
    network_mode: host
