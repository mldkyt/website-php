
services:
  php:
    image: trafex/php-nginx:latest
    ports:
      - "8001:8080"
    volumes:
      - ./src:/var/www/html:z
      - ./components:/var/www/components:z
    restart: always
    pull_policy: always
    env_file: .env

  mysql:
    ports:
      - "3306:3306"
    image: mariadb:12
    env_file: .env
    pull_policy: always
    volumes:
      - ./mariadb:/var/lib/mysql:Z
  phpmyadmin:
    image: phpmyadmin:5
    ports:
      - "9002:80"
    pull_policy: always
    env_file: .env
